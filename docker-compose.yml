services:
  # Production service: Multi-stage build served via lightweight Nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: cannabinoid_guide_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Development service (optional): Run with `docker compose --profile dev up dev`
  dev:
    image: node:20-alpine
    container_name: cannabinoid_guide_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    profiles:
      - dev
